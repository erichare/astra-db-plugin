<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra DB similarity search</title>
<style>/*@shared-css*/
.hit{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border)}
.hit:last-child{border-bottom:0}.hit .rank{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.hit .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hit .s{font-size:12px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .score{font-variant-numeric:tabular-nums;font-size:12px;text-align:right;color:var(--accent-text)}
.hit.clickable{cursor:pointer;border-radius:8px}.hit.clickable:hover{background:var(--surface-2)}
svg text{font-family:var(--sans);font-size:11px;fill:var(--text-2)}svg .q{fill:var(--accent)}svg .dot{fill:var(--accent);opacity:.9}svg .ring{fill:none;stroke:var(--border);stroke-dasharray:3 3}
svg .lbl{fill:var(--text)}svg .dot.hoverable{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script>/*@shared-js*/</script>
<script>/*@bridge*/</script>
<script>
(function () {
  const { h, chip, srSummary } = window.AstraUI;
  let view = "ranked";
  function render(data, api) {
    const root = document.getElementById("root");
    root.replaceChildren();
    const hits = data.hits || [];
    const subject = data.query ? `“${data.query}”` : `document ${data.documentId}`;
    root.append(srSummary(`${hits.length} similarity results for ${subject} in ${data.collection}.`));
    const card = h("div", { class: "card" });
    const toggle = h("div", { class: "toggle" },
      h("button", { class: view === "ranked" ? "on" : "", onclick: () => { view = "ranked"; render(data, api); } }, "Ranked"),
      h("button", { class: view === "map" ? "on" : "", onclick: () => { view = "map"; render(data, api); } }, "Constellation"));
    card.append(h("div", { class: "row between" },
      h("div", null, h("p", { class: "title" }, "Similar to ", h("span", { style: "color:var(--accent-text)" }, subject)),
        h("p", { class: "sub" }, `${data.collection} · ${modeLabel(data.mode)} · top ${hits.length}`)), toggle));
    if (hits.length === 0) { card.append(h("div", { class: "empty", style: "margin-top:12px" }, "No matches")); root.append(card); return; }
    const st = data.stats || {};
    card.append(h("div", { class: "row", style: "gap:6px;margin:10px 0 4px" },
      chip(`best ${fmtScore(st.max)}`, "accent"), chip(`mean ${fmtScore(st.mean)}`), chip(`lowest ${fmtScore(st.min)}`)));
    card.append(view === "ranked" ? ranked(hits, api, data) : constellation(hits, api, data));
    if (api.canCall) card.append(h("p", { class: "note" }, "Click a result to find documents similar to it."));
    root.append(card);
  }
  function fmtScore(s) { return s === null || s === undefined ? "—" : Number(s).toFixed(3); }
  function modeLabel(m) { return m === "hybrid" ? "hybrid (vector + lexical, reranked)" : m === "document" ? "by document vector" : "vectorize"; }
  function ranked(hits, api, data) {
    const list = h("div", { class: "section" });
    for (const hit of hits) {
      const sim = hit.similarity === null ? null : Math.max(0, Math.min(1, hit.similarity));
      const fieldsText = Object.entries(hit.fields || {}).slice(1).map(([k, v]) => `${k}: ${v}`).join(" · ");
      const row = h("div", { class: `hit ${api.canCall ? "clickable" : ""}`, title: api.canCall ? "Find similar documents" : hit.id,
        onclick: api.canCall ? () => api.callTool("similarity_search", { collection: data.collection, keyspace: data.keyspace, documentId: hit.id, limit: data.limit }) : null },
        h("div", { class: "rank" }, hit.rank),
        h("div", { style: "min-width:0" }, h("div", { class: "t" }, hit.title || hit.id), h("div", { class: "s" }, fieldsText || hit.id),
          h("div", { class: "bar", style: "margin-top:5px" }, h("i", { style: `width:${sim === null ? 0 : Math.round(sim * 100)}%` }))),
        h("div", { class: "score" }, hit.similarity === null ? "—" : Number(hit.similarity).toFixed(3)));
      list.append(row);
    }
    return list;
  }
  function constellation(hits, api, data) {
    const W = 640, H = 360, cx = W / 2, cy = H / 2, R = 150;
    const sims = hits.map((x) => x.similarity).filter((s) => s !== null);
    const lo = Math.min(...sims), hi = Math.max(...sims), span = Math.max(hi - lo, 1e-6);
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", "100%"); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Constellation of results: closer to the center means more similar to the query.");
    const ns = (tag, attrs) => { const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
    for (const f of [0.33, 0.66, 1]) svg.append(ns("circle", { class: "ring", cx, cy, r: 30 + R * f }));
    svg.append(ns("circle", { class: "q", cx, cy, r: 7 }));
    const qt = ns("text", { x: cx, y: cy + 22, "text-anchor": "middle", class: "lbl" }); qt.textContent = data.query ? "query" : "source"; svg.append(qt);
    const golden = Math.PI * (3 - Math.sqrt(5));
    hits.forEach((hit, i) => {
      const sim = hit.similarity === null ? lo : hit.similarity;
      const r = 30 + R * (1 - (sim - lo) / span) * 0.9 + (hit.similarity === null ? R : 0);
      const a = i * golden - Math.PI / 2;
      const x = cx + Math.cos(a) * Math.min(r, R + 30), y = cy + Math.sin(a) * Math.min(r, R + 30);
      const dot = ns("circle", { class: `dot ${api.canCall ? "hoverable" : ""}`, cx: x, cy: y, r: 6 + Math.max(0, (sim - lo) / span) * 4 });
      const t = ns("title", {}); t.textContent = `${hit.rank}. ${hit.title} (${hit.similarity === null ? "—" : Number(hit.similarity).toFixed(3)})`; dot.append(t);
      if (api.canCall) dot.addEventListener("click", () => api.callTool("similarity_search", { collection: data.collection, keyspace: data.keyspace, documentId: hit.id, limit: data.limit }));
      svg.append(dot);
      const label = ns("text", { x: x + (Math.cos(a) >= 0 ? 10 : -10), y: y + 4, "text-anchor": Math.cos(a) >= 0 ? "start" : "end", class: "lbl" });
      label.textContent = (hit.title || hit.id).slice(0, 28); svg.append(label);
    });
    return h("div", { class: "section" }, svg, h("p", { class: "muted", style: "text-align:center;margin:4px 0 0" }, "Closer to the center = more similar"));
  }
  window.AstraBridge.mount(render);
})();
</script>
</body>
</html>
