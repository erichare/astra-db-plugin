name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Widget server — install, test, build
        working-directory: server
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build

      - name: skillsaw lint (strict — no warnings)
        run: |
          pip install --quiet skillsaw
          skillsaw lint . --strict

      - name: skillsaw grade gate (A+)
        run: |
          skillsaw badge . -o /tmp/badge.json
          python3 -c "import json; grade = json.load(open('/tmp/badge.json'))['message']; assert grade == 'A+', f'grade {grade} is below A+'"

      - name: Python snippet syntax
        run: PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m compileall -q skills/astra-toolkit/clients/python/examples

      - name: Repository tests (scripts, manifests, skills, docs)
        run: |
          node --test 'tests/*.test.mjs'
          node scripts/check-versions.mjs

      - name: Plugin structure validation
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
